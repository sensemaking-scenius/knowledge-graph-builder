id: https://example.org/knowledge-graph-builder/sioc-min
name: sioc_min
description: Minimal SIOC-aligned schema for Telegram-derived social data

prefixes:
  sioc: http://rdfs.org/sioc/ns#
  dcterms: http://purl.org/dc/terms/
  schema: http://schema.org/
  foaf: http://xmlns.com/foaf/0.1/
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  tg: https://example.org/telegram/
  linkml: https://w3id.org/linkml/

default_prefix: tg
default_range: string

imports:
  - linkml:types

classes:
  GraphDocument:
    tree_root: true
    slots:
      - id
      - community
      - users
      - links
      - posts
      - threads

  Community:
    class_uri: sioc:Community
    slots:
      - id
      - name
      - description
      - member_count

  Thread:
    class_uri: sioc:Thread
    slots:
      - id
      - name
      - has_parent

  UserAccount:
    class_uri: sioc:UserAccount
    slots:
      - id
      - name
      - username
      - is_bot
      - is_verified
      - is_premium

  Link:
    class_uri: schema:URL
    slots:
      - id

  Post:
    class_uri: sioc:Post
    slots:
      - id
      - content
      - created
      - modified
      - has_creator
      - has_container
      - has_thread
      - reply_to
      - links_to
      - forwards
      - pinned
      - topics
      - mentions
      - entity_links
      - num_views
      - num_replies
      - reaction_count
      - reactions
      - media_type
      - forwarded_from
      - is_service
      - service_action

enums:
  MediaType:
    permissible_values:
      photo:
      video:
      document:
      webpage:
      audio:
      sticker:
      other:

  ServiceActionType:
    permissible_values:
      join:
      leave:
      pin:
      title_change:
      photo_change:
      other:

slots:
  id:
    identifier: true
    slot_uri: dcterms:identifier

  name:
    slot_uri: foaf:name

  description:
    slot_uri: dcterms:description

  username:
    slot_uri: foaf:accountName

  member_count:
    range: integer
    slot_uri: tg:member_count

  is_bot:
    range: boolean
    slot_uri: tg:is_bot

  is_verified:
    range: boolean
    slot_uri: tg:is_verified

  is_premium:
    range: boolean
    slot_uri: tg:is_premium

  has_parent:
    range: Community
    slot_uri: sioc:has_parent

  content:
    slot_uri: sioc:content

  created:
    range: datetime
    slot_uri: dcterms:created

  modified:
    range: datetime
    slot_uri: dcterms:modified

  has_creator:
    range: UserAccount
    slot_uri: sioc:has_creator

  has_container:
    range: Community
    slot_uri: sioc:has_container

  has_thread:
    range: Thread
    slot_uri: tg:has_thread

  reply_to:
    range: Post
    slot_uri: sioc:reply_of

  links_to:
    multivalued: true
    range: Link
    slot_uri: sioc:links_to

  community:
    range: Community
    inlined: true

  users:
    range: UserAccount
    multivalued: true
    inlined: true

  links:
    range: Link
    multivalued: true
    inlined: true

  posts:
    range: Post
    multivalued: true
    inlined: true

  threads:
    range: Thread
    multivalued: true
    inlined: true

  forwards:
    range: integer
    slot_uri: tg:forwards

  pinned:
    range: boolean
    slot_uri: tg:pinned

  topics:
    multivalued: true
    range: string
    slot_uri: sioc:topic

  mentions:
    multivalued: true
    range: string
    slot_uri: tg:mentions

  entity_links:
    multivalued: true
    range: Link
    slot_uri: sioc:links_to

  num_views:
    range: integer
    slot_uri: sioc:num_views

  num_replies:
    range: integer
    slot_uri: sioc:num_replies

  reaction_count:
    range: integer
    slot_uri: tg:reaction_count

  reactions:
    multivalued: true
    range: string
    slot_uri: tg:reactions

  media_type:
    range: MediaType
    slot_uri: tg:media_type

  forwarded_from:
    slot_uri: tg:forwarded_from

  is_service:
    range: boolean
    slot_uri: tg:is_service

  service_action:
    range: ServiceActionType
    slot_uri: tg:service_action
