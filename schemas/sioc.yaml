id: https://example.org/knowledge-graph-builder/sioc
name: sioc
description: SIOC-aligned schema for Telegram-derived social knowledge graphs

prefixes:
  sioc: http://rdfs.org/sioc/ns#
  sioc_types: http://rdfs.org/sioc/types#
  dcterms: http://purl.org/dc/terms/
  dc: http://purl.org/dc/elements/1.1/
  foaf: http://xmlns.com/foaf/0.1/
  skos: http://www.w3.org/2004/02/skos/core#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  tg: https://example.org/telegram/
  linkml: https://w3id.org/linkml/

default_prefix: tg
default_range: string

imports:
  - linkml:types

classes:

  # ── Root container ──────────────────────────────────────────────────
  GraphDocument:
    tree_root: true
    slots:
      - id
      - community
      - site
      - forums
      - users
      - persons
      - posts
      - threads
      - concepts
      - attachments
      - linked_documents
      - polls

  # ── Space / Container hierarchy ─────────────────────────────────────
  Community:
    class_uri: sioc:Community
    slots:
      - id
      - name
      - description
      - has_part

  Site:
    class_uri: sioc:Site
    slots:
      - id
      - name
      - host_of

  Forum:
    class_uri: sioc:Forum
    slots:
      - id
      - name
      - description
      - has_host
      - has_parent_forum
      - parent_of
      - container_of
      - closed

  Thread:
    class_uri: sioc:Thread
    slots:
      - id
      - name
      - has_parent_forum

  # ── Agents ──────────────────────────────────────────────────────────
  User:
    class_uri: sioc:User
    slots:
      - id
      - sioc_name
      - username
      - is_bot
      - account_of
      - avatar
      - user_description

  Person:
    class_uri: foaf:Person
    slots:
      - id
      - name
      - holds_account

  # ── Content ─────────────────────────────────────────────────────────
  Post:
    class_uri: sioc:Post
    slots:
      - id
      - content
      - created
      - modified
      - has_creator
      - has_container
      - reply_of
      - has_reply
      - sibling
      - links_to
      - attachment
      - has_poll
      - topics
      - forwards
      - pinned
      - quote_text
      - grouped_id
      - via_bot

  Poll:
    class_uri: sioc_types:Poll
    slots:
      - id
      - question
      - answers
      - total_voters
      - quiz
      - poll_closed
      - public_voters
      - multiple_choice

  # ── Documents ───────────────────────────────────────────────────────
  Attachment:
    class_uri: foaf:Document
    slots:
      - id
      - format
      - extent
      - media_type
      - duration

  LinkedDocument:
    class_uri: foaf:Document
    slots:
      - id
      - title
      - doc_description
      - doc_creator
      - site_name

  # ── Knowledge ───────────────────────────────────────────────────────
  Concept:
    class_uri: skos:Concept
    slots:
      - id
      - pref_label

  # ── Reaction (schema-only, not populated in v1) ─────────────────────
  Reaction:
    class_uri: tg:Reaction
    slots:
      - id
      - reactor
      - emoji
      - target

# ═══════════════════════════════════════════════════════════════════════
# Enums
# ═══════════════════════════════════════════════════════════════════════

enums:
  MediaType:
    permissible_values:
      photo:
      video:
      document:
      audio:
      voice:
      sticker:
      animation:
      other:

# ═══════════════════════════════════════════════════════════════════════
# Slots
# ═══════════════════════════════════════════════════════════════════════

slots:

  # ── Identifiers ─────────────────────────────────────────────────────
  id:
    identifier: true
    slot_uri: sioc:id

  # ── Names / labels ──────────────────────────────────────────────────
  name:
    slot_uri: foaf:name

  sioc_name:
    slot_uri: sioc:name

  username:
    slot_uri: foaf:accountName

  pref_label:
    slot_uri: skos:prefLabel

  title:
    slot_uri: dc:title

  question:
    slot_uri: tg:question

  # ── Descriptions ────────────────────────────────────────────────────
  description:
    slot_uri: dcterms:description

  doc_description:
    slot_uri: dcterms:description

  user_description:
    slot_uri: dcterms:description

  # ── Hierarchy / containment ─────────────────────────────────────────
  has_part:
    range: Site
    slot_uri: dcterms:hasPart

  has_host:
    range: Site
    slot_uri: sioc:has_host

  has_parent_forum:
    range: Forum
    slot_uri: sioc:has_parent

  parent_of:
    range: Forum
    multivalued: true
    slot_uri: sioc:parent_of

  host_of:
    range: Forum
    multivalued: true
    slot_uri: sioc:host_of

  container_of:
    range: Post
    multivalued: true
    slot_uri: sioc:container_of
    inlined: false

  has_container:
    range: Forum
    slot_uri: sioc:has_container

  # ── Agent links ─────────────────────────────────────────────────────
  account_of:
    range: Person
    slot_uri: sioc:account_of

  holds_account:
    range: User
    multivalued: true
    slot_uri: foaf:holdsAccount

  has_creator:
    range: User
    slot_uri: sioc:has_creator

  via_bot:
    range: User
    slot_uri: tg:via_bot

  # ── Content properties ──────────────────────────────────────────────
  content:
    slot_uri: sioc:content

  created:
    range: datetime
    slot_uri: dcterms:created

  modified:
    range: datetime
    slot_uri: dcterms:modified

  # ── Reply / forward ─────────────────────────────────────────────────
  reply_of:
    range: Post
    slot_uri: sioc:reply_of

  has_reply:
    range: Post
    multivalued: true
    slot_uri: sioc:has_reply
    inlined: false

  sibling:
    range: Post
    slot_uri: sioc:sibling

  # ── Attachments / links ─────────────────────────────────────────────
  links_to:
    multivalued: true
    range: LinkedDocument
    slot_uri: sioc:links_to

  attachment:
    multivalued: true
    range: Attachment
    slot_uri: sioc:attachment

  has_poll:
    range: Poll
    slot_uri: tg:has_poll

  # ── Topics ──────────────────────────────────────────────────────────
  topics:
    multivalued: true
    range: Concept
    slot_uri: sioc:topic

  # ── Telegram-specific ───────────────────────────────────────────────
  forwards:
    range: integer
    slot_uri: tg:forwards

  pinned:
    range: boolean
    slot_uri: tg:pinned

  closed:
    range: boolean
    slot_uri: tg:closed

  is_bot:
    range: boolean
    slot_uri: tg:is_bot

  avatar:
    slot_uri: tg:avatar

  quote_text:
    slot_uri: tg:quote_text

  grouped_id:
    slot_uri: tg:grouped_id

  # ── Document properties ─────────────────────────────────────────────
  format:
    slot_uri: dcterms:format

  extent:
    range: integer
    slot_uri: dcterms:extent

  media_type:
    range: MediaType
    slot_uri: tg:media_type

  duration:
    range: integer
    slot_uri: tg:duration

  doc_creator:
    slot_uri: dcterms:creator

  site_name:
    slot_uri: tg:site_name

  # ── Poll properties ─────────────────────────────────────────────────
  answers:
    multivalued: true
    slot_uri: tg:answers

  total_voters:
    range: integer
    slot_uri: tg:total_voters

  quiz:
    range: boolean
    slot_uri: tg:quiz

  poll_closed:
    range: boolean
    slot_uri: tg:poll_closed

  public_voters:
    range: boolean
    slot_uri: tg:public_voters

  multiple_choice:
    range: boolean
    slot_uri: tg:multiple_choice

  # ── Reaction properties (schema-only) ───────────────────────────────
  reactor:
    range: User
    slot_uri: tg:reactor

  emoji:
    slot_uri: tg:emoji

  target:
    range: Post
    slot_uri: tg:target

  # ── GraphDocument collection slots ──────────────────────────────────
  community:
    range: Community
    inlined: true

  site:
    range: Site
    inlined: true

  forums:
    range: Forum
    multivalued: true
    inlined: true

  users:
    range: User
    multivalued: true
    inlined: true

  persons:
    range: Person
    multivalued: true
    inlined: true

  posts:
    range: Post
    multivalued: true
    inlined: true

  threads:
    range: Thread
    multivalued: true
    inlined: true

  concepts:
    range: Concept
    multivalued: true
    inlined: true

  attachments:
    range: Attachment
    multivalued: true
    inlined: true

  linked_documents:
    range: LinkedDocument
    multivalued: true
    inlined: true

  polls:
    range: Poll
    multivalued: true
    inlined: true
