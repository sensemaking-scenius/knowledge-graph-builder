[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/builder"]

[project]
name = "knowledge-graph-builder"
version = "0.1.0"
description = "ETL pipeline: Telegram → LinkML → RDF/SIOC → Oxigraph"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.0",
    "linkml>=1.9.6",
    "linkml-runtime>=1.9.5",
    "pyoxigraph>=0.5.4",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "rich>=14.3.1",
    "telethon>=1.42.0",
]
